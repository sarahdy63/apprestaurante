<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Patacon | Menú</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="logo" href="index.html">
          <img src="assets/img/logo.png" alt="Gastro" class="logo-img" />
        </a>
        <div class="nav-right">
          <nav class="nav-links">
            <a href="index.html">Inicio</a
            ><a class="active" href="menu.html">Menú</a
            ><a href="location.html">Ubicación</a
            ><a href="about.html">Quiénes somos</a>
          </nav>
          <a
            href="tracking.html"
            class="cart-access"
            title="Ver mi pedido"
            aria-label="Ver mi pedido"
          >
            <img src="assets/img/logo_carrito.png" alt="Carrito" />
          </a>
          <span class="nav-divider"></span>
          <a
            href="admin-login.html"
            class="admin-access"
            title="Acceso administrador"
            aria-label="Acceso administrador"
          ></a>
        </div>
      </div>
    </header>
    <main class="section">
      <div class="container">
        <div class="layout-menu">
          <div class="sidebar-sticky">
            <span class="eyebrow">Nuestro catálogo</span>

            <aside class="panel categories">
              <h3>Categorías</h3>
              <button class="category-btn active" data-category="Todos">
                Todos
              </button>
              <button class="category-btn" data-category="Hamburguesas">
                Hamburguesas</button
              ><button class="category-btn" data-category="Picadas">
                Picadas</button
              ><button class="category-btn" data-category="Salchipapas">
                Salchipapas</button
              ><button class="category-btn" data-category="Toppings">
                Toppings</button
              ><button class="category-btn" data-category="Bebidas">
                Bebidas
              </button>
            </aside>
          </div>

          <section id="products" class="products-grid"></section>

          <aside id="cart" class="panel cart-panel">
            <h3>Tu pedido</h3>
            <div id="cartItems"></div>
            <div class="totals">
              <div class="total-row">
                <span>Subtotal</span><strong data-subtotal>$0</strong>
              </div>
              <div class="total-row">
                <span>Domicilio</span><strong data-shipping>$0</strong>
              </div>
              <div class="total-row grand">
                <span>Total</span><span data-total>$0</span>
              </div>

              <div id="minOrderHint" class="min-order-hint" hidden></div>

              <div class="terms-check">
                <input type="checkbox" id="terminosCheck" />
                <label for="terminosCheck">
                  Acepto los
                  <a href="terminos.html" target="_blank" rel="noopener">
                    términos y condiciones
                  </a>
                </label>
              </div>

              <button
                class="btn btn-primary"
                style="width: 100%; margin-top: 10px"
                onclick="intentarConfirmar()"
              >
                Confirmar pedido
              </button>
            </div>
          </aside>
        </div>
      </div>
    </main>
    <div id="checkoutModal" class="modal">
      <div class="modal-card">
        <div class="modal-head">
          <h2>Datos de entrega</h2>
          <button class="close" data-close="checkoutModal">×</button>
        </div>
        <div class="info-box">
          <strong>Total a pagar: </strong><span data-total></span>
        </div>
        <form id="checkoutForm" class="form-grid">
          <div class="field">
            <label>Nombre</label>
            <input
              id="nombreInput"
              required
              pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
              minlength="3"
              maxlength="15"
              title="Solo letras, entre 2 y 50 caracteres"
              placeholder="Sara"
            />
          </div>
          <div class="field">
            <label>Apellido</label>
            <input
              id="apellidoInput"
              required
              pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
              minlength="2"
              maxlength="10"
              title="Solo letras, entre 2 y 50 caracteres"
              placeholder="Peña"
            />
          </div>
          <div class="field">
            <label>Teléfono</label>
            <input
              id="telefonoInput"
              type="tel"
              inputmode="numeric"
              pattern="3[0-9]{9}"
              maxlength="10"
              title="Debe empezar por 3 "
              required
              placeholder="3241857875"
            />
          </div>
          <div class="field">
            <label>Barrio</label>
            <select id="barrioSelect" required>
              <option value="">Selecciona tu barrio</option>
              <option value="Las Granjas">Las Granjas</option>
              <option value="Campo Nuñez">Campo Nuñez</option>
              <option value="Altico">Altico</option>
              <option value="Diego de Ospina">Diego de Ospina</option>
              <option value="Quirinal">Quirinal</option>
              <option value="Ipanema">Ipanema</option>
              <option value="Galindo">Galindo</option>
              <option value="Chapinero">Chapinero</option>
              <option value="Los Alpes">Los Alpes</option>
              <option value="Las Mercedes">Las Mercedes</option>
              <option value="Candido">Candido</option>
              <option value="Calixto">Calixto</option>
              <option value="Kennedy">Kennedy</option>
              <option value="otro">Otro (especificar)</option>
            </select>
          </div>
          <div class="field" id="barrioOtroWrap" style="display: none">
            <label>Especifica tu barrio</label>
            <input
              id="barrioOtroInput"
              maxlength="40"
              placeholder="Nombre del barrio"
            />
          </div>
          <div class="field full">
            <label>Dirección / referencia</label>
            <textarea
              id="direccionInput"
              required
              rows="3"
              maxlength="30"
              placeholder="Calle, número y referencia"
            ></textarea>
          </div>
          <div class="field full">
            <label>Método de pago</label>
            <input id="metodoPagoSelect" value="Pago contra entrega" readonly />
          </div>
          <button class="btn btn-primary field full" type="submit">
            Confirmar pedido →
          </button>
        </form>
      </div>
    </div>
    <footer class="footer" id="siteFooter"></footer>
    <script src="js/app.js"></script>
  </body>
</html>
