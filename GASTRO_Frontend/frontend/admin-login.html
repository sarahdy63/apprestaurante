<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gastro | Administrador</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="login-page">
    <form id="adminLogin" class="panel login-card">
      <span class="eyebrow">Acceso administrador</span>
      <h1>Panel de control</h1>
      <p class="small">
        
      </p>
      <div class="field">
        <label>Correo electrónico</label
        ><input
          id="adminEmail"
          required
          type="email"
          placeholder="correo@ejemplo.com"
        />
      </div>
      <div class="field">
        <label>Contraseña</label
        ><input id="adminPassword" required type="password" placeholder="••••••••" />
        <p class="small link-right">
        <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </p>
      <button class="btn btn-primary" style="width: 100%">
        Iniciar sesión →
      </button>
      <p class="small"></p>
    </form>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
