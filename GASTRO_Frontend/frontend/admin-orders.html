<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Patacon Admin | Pedidos</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="admin-body">
    <div class="admin-shell">
      <aside class="sidebar">
        <a class="logo" href="index.html">
          <img
            src="assets/img/logo.png"
            alt="Patacón Pisa'o"
            class="logo-img"
          />
        </a>
        <a class="side-link active" href="admin-orders.html">Pedidos</a
        ><a class="side-link" href="admin-menu.html">Menú</a
        ><a class="side-link" href="index.html">Ver sitio</a
        ><a
          class="side-link"
          href="#"
          onclick="
            logout();
            return false;
          "
          >Cerrar sesión</a
        >
      </aside>
      <main class="admin-main">
        <div class="admin-top">
          <div>
            <span class="eyebrow">Admin dashboard</span>
            <h1>Gestión de pedidos</h1>
          </div>
        </div>
        <section class="stats">
          <div class="panel stat">
            <span>Hoy</span><strong id="statOrders">0</strong>Pedidos
          </div>
          <div class="panel stat">
            <span>Por preparar</span
            ><strong id="statPending">0</strong>Pendientes
          </div>
          <div class="panel stat">
            <span>En camino</span><strong id="statRoutes">0</strong>Rutas
          </div>
          <div class="panel stat">
            <span>Ventas del día</span><strong id="statSales">$0</strong>
          </div>
        </section>

        <!-- Filtros rápidos por estado. Se pueden seleccionar uno o varios. -->
        <section
          class="order-status-filters"
          aria-label="Filtrar pedidos por estado"
        >
          <button
            class="order-status-card received"
            type="button"
            data-order-status="RECIBIDO"
            aria-pressed="false"
          >
            <span class="order-status-dot"></span>
            <span class="order-status-label">Recibidos</span>
            <strong id="statusCountReceived">0</strong>
          </button>
          <button
            class="order-status-card preparing"
            type="button"
            data-order-status="PREPARANDO"
            aria-pressed="false"
          >
            <span class="order-status-dot"></span>
            <span class="order-status-label">Preparando</span>
            <strong id="statusCountPreparing">0</strong>
          </button>
          <button
            class="order-status-card route"
            type="button"
            data-order-status="EN_CAMINO"
            aria-pressed="false"
          >
            <span class="order-status-dot"></span>
            <span class="order-status-label">En camino</span>
            <strong id="statusCountRoute">0</strong>
          </button>
          <button
            class="order-status-card delivered"
            type="button"
            data-order-status="ENTREGADO"
            aria-pressed="false"
          >
            <span class="order-status-dot"></span>
            <span class="order-status-label">Entregados</span>
            <strong id="statusCountDelivered">0</strong>
          </button>
          <button
            class="order-status-card cancelled"
            type="button"
            data-order-status="CANCELADO"
            aria-pressed="false"
          >
            <span class="order-status-dot"></span>
            <span class="order-status-label">Cancelados</span>
            <strong id="statusCountCancelled">0</strong>
          </button>
        </section>
        <p id="activeStatusHelp" class="status-filter-help">
          Sin estados seleccionados: mostrando todos los pedidos.
        </p>

        <div class="panel filters">
          <input
            id="orderSearch"
            type="search"
            placeholder="Buscar por código, nombre o teléfono..."
          />
          <select id="orderStatusFilter">
            <option value="">Todos los estados</option>
            <option value="RECIBIDO">Recibido</option>
            <option value="PREPARANDO">Preparando</option>
            <option value="EN_CAMINO">En camino</option>
            <option value="ENTREGADO">Entregado</option>
            <option value="CANCELADO">Cancelado</option>
          </select>
          <input id="orderDateFilter" type="date" />
          <button id="orderClearFilters" class="btn btn-outline" type="button">
            Limpiar
          </button>
        </div>
        <div class="panel table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Productos</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr>
                <td colspan="6">Cargando pedidos...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="ordersPagination" class="pagination"></div>
      </main>
    </div>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
