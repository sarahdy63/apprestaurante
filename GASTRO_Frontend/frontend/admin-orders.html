<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gastro Admin | Pedidos</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="admin-body">
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="logo">GASTRO</div>
        <a class="side-link active" href="admin-orders.html">Pedidos</a
        ><a class="side-link" href="admin-menu.html">Menú</a
        ><a class="side-link" href="index.html">Ver sitio</a
        ><a
          class="side-link"
          href="#"
          onclick="
            logout();
            return false;
          "
          >Cerrar sesión</a
        >
      </aside>
      <main class="admin-main">
        <div class="admin-top">
          <div>
            <span class="eyebrow">Admin dashboard</span>
            <h1>Gestión de pedidos</h1>
            <p class="small">
              Supervisa y actualiza el flujo de pedidos en tiempo real.
            </p>
          </div>
        </div>
        <section class="stats">
          <div class="panel stat">
            <span>Hoy</span><strong id="statOrders">0</strong>Pedidos
          </div>
          <div class="panel stat">
            <span>Por preparar</span
            ><strong id="statPending">0</strong>Pendientes
          </div>
          <div class="panel stat">
            <span>En camino</span><strong id="statRoutes">0</strong>Rutas
          </div>
          <div class="panel stat">
            <span>Ventas del día</span><strong id="statSales">$0</strong>
          </div>
        </section>
        <div class="panel table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Productos</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr>
                <td colspan="6">Cargando pedidos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
